name: Auto-score fixtures

# Pulls match status from football-data.org and (a) settles FINISHED
# fixtures via process_fixture_result(), (b) stashes running live scores
# for IN_PLAY / PAUSED fixtures into fixtures.live_* so the pool page
# can render big live numbers. Idempotent: re-runs skip already-scored,
# update live snapshots in place, and clear stale live rows on FINISHED.
#
# Schedule is tuned to WC26 match windows. Kickoffs cluster at 12/15/18/21
# ET; matches last ~105 min regulation + injury (KO can add ~30 min ET +
# penalties). We poll every 3 min during 18:00–04:00 UTC so live score
# refreshes feel near-real-time, and skip overnight when nothing is on.
#
# Required repo secrets:
#   DATABASE_URL              Railway Postgres connection string
#   FOOTBALL_DATA_API_KEY     football-data.org API token

on:
  schedule:
    - cron: "*/3 18-23 * * *"   # 2pm–8pm ET (afternoon games)
    - cron: "*/3 0-4 * * *"     # 8pm–12am ET + cushion for ET/penalties
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply scores (default = dry-run preview only)"
        type: boolean
        default: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install psycopg2-binary requests werkzeug

      - name: Run auto-score
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY:  ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.apply }}" != "true" ]; then
            python3 sim/auto_score_from_api.py
          else
            python3 sim/auto_score_from_api.py --apply
          fi
