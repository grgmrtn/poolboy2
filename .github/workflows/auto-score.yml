name: Auto-score fixtures

# Pulls FINISHED matches from football-data.org and writes scores back to
# fixtures + credits payouts via process_fixture_result().
# Idempotent: re-runs skip already-scored fixtures.
#
# Schedule is tuned to WC26 match-end windows. Kickoffs cluster at
# 12/15/18/21 ET (= 16/19/22/01 UTC during EDT). Matches last ~105 min
# regulation + injury (KO can add ~30 min ET + penalties), so finishes
# land in 18:00–04:00 UTC. We poll every 10 min during that window and
# skip overnight when there's nothing to catch.
#
# Required repo secrets:
#   DATABASE_URL              Railway Postgres connection string
#   FOOTBALL_DATA_API_KEY     football-data.org API token

on:
  schedule:
    - cron: "*/10 18-23 * * *"   # 2pm–8pm ET (afternoon match-ends)
    - cron: "*/10 0-4 * * *"     # 8pm–12am ET + cushion for ET/penalties
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply scores (default = dry-run preview only)"
        type: boolean
        default: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install psycopg2-binary requests werkzeug

      - name: Run auto-score
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY:  ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.apply }}" != "true" ]; then
            python3 sim/auto_score_from_api.py
          else
            python3 sim/auto_score_from_api.py --apply
          fi
